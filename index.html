<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>HI-TECH ECO ENERGY — Solar Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ระบบมอนิเตอร์พลังงานโซลาร์แบบเรียลไทม์ของ Hi-Tech Eco Energy ดูกำลังผลิต สถานะ และแจ้งเตือนของทุกไซต์ในเครือได้ในหน้าเดียว">
<meta property="og:title" content="HI-TECH ECO ENERGY — Solar Monitoring">
<meta property="og:description" content="ระบบมอนิเตอร์พลังงานโซลาร์แบบเรียลไทม์ — ดูกำลังผลิต สถานะ และแจ้งเตือนของทุกไซต์ในเครือได้ในหน้าเดียว">
<meta property="og:type" content="website">
<style>
  :root{
    --cream:#fffaf3;
    --panel:#ffffff;
    --ink:#2b1706;
    --sub:#9a8672;
    --line:#f3e6d5;
    --orange:#ff7a1a;
    --orange-deep:#e85d04;
    --gold:#f5a23e;
    --gold-soft:#fdead2;
    --amber-soft:#fff1de;
    --ok:#2fb35d;
    --ok-soft:#e6f7ec;
    --issue:#ff4d3d;
    --issue-soft:#ffe9e5;
    --stale:#9a9a9e;
    --stale-soft:#f2f0eb;
    --v-huawei:#ff7a1a;
    --v-deye:#f5a23e;
    --v-sigen:#e85d04;
    --deep:#2a1002;
    --deep2:#4a1d02;
    --header-ink:#2b1706;
    --header-sub:#9a8672;
    --stat-val:#7a4400;
    --stat-lbl:#a8752e;
    --ok-ink:#186b38;
    --issue-ink:#a8281c;
    --warn-ink:#8a6100;
    --stale-ink:#6b6b6f;
    --glass:rgba(255,255,255,.72);
    --focus:#e85d04;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Noto Sans Thai",sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---------- Realistic minimal sunlight glow (light mode only) ---------- */
  #sunGlow{
    position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;
  }
  body.dark-mode #sunGlow{display:none;}
  #sunGlow .sun-core{
    position:absolute;top:-14%;right:8%;width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,246,228,.95) 0%,
      rgba(255,228,180,.55) 32%,
      rgba(255,208,148,.2) 55%,
      transparent 72%);
    filter:blur(8px);
    animation:sunPulseSoft 6s ease-in-out infinite;
  }
  #sunGlow .beam{
    position:absolute;top:-25%;right:14%;width:640px;height:1300px;
    background:linear-gradient(180deg, rgba(255,230,185,.28) 0%, transparent 68%);
    transform-origin:top center;
    filter:blur(22px);
  }
  #sunGlow .beam.b1{transform:rotate(16deg);opacity:.85;}
  #sunGlow .beam.b2{transform:rotate(34deg);opacity:.5;width:520px;}
  @keyframes sunPulseSoft{0%,100%{opacity:.92;}50%{opacity:1;}}

  #leafLayer{
    position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  }
  body.dark-mode #leafLayer{display:none;}
  .leaf-piece{
    position:absolute;top:-40px;font-size:22px;opacity:.55;
    animation-name:leafFall,leafSway;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite;
    filter:drop-shadow(0 2px 3px rgba(90,50,0,.15));
  }
  @keyframes leafFall{from{transform:translateY(-40px) rotate(0deg);}to{transform:translateY(110vh) rotate(360deg);}}
  @keyframes leafSway{0%,100%{margin-left:0;}50%{margin-left:60px;}}

  /* ---------- Header: dark floating capsule navbar ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 34px 16px;
    padding:9px 14px 9px 22px;
    flex-shrink:0;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:999px;
    box-shadow:0 16px 36px rgba(150,80,20,.16), inset 0 1px 0 rgba(255,255,255,.8);
    position:relative;
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:12px;position:relative;}
  .brand img.logo{
    height:36px;width:auto;display:block;flex-shrink:0;
    filter:drop-shadow(0 2px 5px rgba(150,80,20,.15));
  }
  .header-right{display:flex;align-items:center;gap:12px;position:relative;}
  #clock{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--header-ink);}
  #clock small{display:block;font-size:10.5px;font-weight:500;color:var(--header-sub);margin-top:1px;}
  #pauseBtn{
    border:none;
    background:linear-gradient(180deg, var(--gold) 0%, var(--orange-deep) 100%);
    color:#fff;
    padding:10px 19px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, background .22s ease;
  }
  #pauseBtn:hover{transform:translateY(-2px) scale(1.04);}
  #pauseBtn:active{transform:translateY(0) scale(.96);transition-duration:.12s;}

  /* ---------- Search button + dropdown ---------- */
  #searchToggleBtn{
    border:none;background:linear-gradient(180deg, var(--gold) 0%, var(--orange-deep) 100%);color:#fff;
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
  }
  #searchToggleBtn:hover{transform:translateY(-2px) scale(1.08) rotate(-6deg);}
  #searchToggleBtn:active{transform:scale(.92) rotate(0deg);transition-duration:.12s;}
  #darkModeToggle{
    border:none;background:linear-gradient(180deg, var(--gold) 0%, var(--orange-deep) 100%);color:#fff;
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
  }
  #darkModeToggle:hover{transform:translateY(-2px) scale(1.08);}
  #darkModeToggle:active{transform:scale(.92);transition-duration:.12s;}
  #searchBar{
    position:absolute;top:calc(100% + 12px);right:0;
    display:none;align-items:center;gap:10px;
    width:300px;max-width:calc(100vw - 40px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 20px 44px rgba(40,20,0,.3);
    z-index:200;
  }
  #searchBar.show{display:flex;}
  #searchIcon{font-size:14px;opacity:.6;flex-shrink:0;}
  #searchInput{
    flex:1;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:14px;color:var(--ink);
  }
  #searchInput::placeholder{color:var(--sub);}
  #searchClear{
    border:none;background:var(--stale-soft);color:var(--sub);
    width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;flex-shrink:0;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .15s ease;
  }
  #searchClear:hover{background:var(--line);transform:scale(1.12);}
  #searchClear:active{transform:scale(.9);}
  #searchNoResults{
    display:none;flex:1;align-items:center;justify-content:center;
    color:var(--sub);font-size:14px;padding:40px;
  }

  /* ---------- Ribbon: floating gold/orange chip pill ---------- */
  #ribbon{
    flex-shrink:0;
    background:linear-gradient(120deg, var(--gold) 0%, var(--orange-deep) 100%);
    color:#fff;
    display:none;
    align-items:center;
    margin:0 34px 16px;
    padding:12px 22px;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.1px;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    z-index:5;
    border-radius:999px;
    box-shadow:0 12px 28px rgba(190,90,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  #ribbon.show{display:flex;}

  /* ---------- Data-freshness warning: a collector stopped writing to the sheet ---------- */
  #healthBar{
    display:none;flex-shrink:0;align-items:center;gap:10px;
    margin:6px 34px 6px;padding:10px 18px;border-radius:14px;
    background:var(--issue-soft);color:var(--issue-ink);border:1px solid #ffcec5;
    font-size:13px;font-weight:600;line-height:1.4;
  }
  #healthBar.show{display:flex;}
  #healthBar b{font-weight:800;}
  #ribbon .siren{
    flex-shrink:0;margin-right:13px;width:9px;height:9px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 0 rgba(255,255,255,.7);
    animation: dotPulse 1.6s ease-out infinite;
  }
  #ribbonTrack{display:inline-flex;gap:34px;animation:scroll 24s linear infinite;color:#fff;}
  #ribbonTrack span{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px;}
  #ribbonTrack span:hover{text-decoration-color:#fff;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @keyframes dotPulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,.6);}
    70%{box-shadow:0 0 0 9px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }

  /* ---------- Main grid ---------- */
  main{
    flex:1;
    padding:14px 34px 6px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-rows:1fr;
    gap:16px;
    overflow:hidden;
    isolation:isolate;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:0;
    display:flex;
    flex-direction:column;
    min-height:0;
    box-shadow:
      0 1px 0 rgba(255,255,255,.8) inset,
      0 2px 4px rgba(30,20,0,.04),
      0 14px 28px rgba(30,20,0,.10);
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.8) inset,
      0 2px 4px rgba(30,20,0,.05),
      0 20px 38px rgba(30,20,0,.16);
  }
  .card.issue{
    border-color:#ffcec5;
    animation:pulse 2s ease-in-out infinite;
  }
  .card.warning{
    border-color:#ffe1a0;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,77,61,.28);}
    50%{box-shadow:0 0 0 8px rgba(255,77,61,0);}
  }
  .card.muted{opacity:1;}
  .vendor-chip-badge{
    flex-shrink:0;align-self:flex-start;
    font-size:9.5px;font-weight:800;color:#fff;
    padding:3px 9px;border-radius:999px;
    letter-spacing:.2px;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .vendor-chip-badge.Huawei{background:linear-gradient(135deg,#ff9d4d,var(--v-huawei));}
  .vendor-chip-badge.Deye{background:linear-gradient(135deg,#ffcb7a,var(--v-deye));}
  .vendor-chip-badge.Sigen{background:linear-gradient(135deg,#ff8a5c,var(--v-sigen));}

  /* Photo of the customer's house, fills whatever height the card body leaves. */
  .card-photo{
    position:relative;flex:1 1 auto;min-height:64px;
    background-color:var(--amber-soft);
    background-size:cover;background-position:center;
  }
  .card-body{
    position:relative;flex-shrink:0;
    margin-top:-18px;padding:12px 16px 14px;
    background:var(--panel);border-radius:18px 18px 0 0;
  }
  .card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .card-meta-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .card-alert-banner{
    position:absolute;top:0;left:0;right:0;z-index:1;
    padding:7px 14px 7px 12px;
    display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:700;color:#fff;
  }
  .card-alert-banner .banner-dot{
    width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;
    box-shadow:0 0 0 0 rgba(255,255,255,.7);
    animation:dotPulse 1.6s ease-out infinite;
  }
  .card-alert-banner .banner-text{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-alert-banner.banner-issue{background:linear-gradient(90deg,#ff5a45,#e8281c);}
  .card-alert-banner.banner-warning{background:linear-gradient(90deg,var(--gold),var(--orange-deep));}
  .card-alert-banner.banner-offline{background:linear-gradient(90deg,#9a9a9e,#6b6b6f);}

  .site-name{
    flex:1;min-width:0;
    font-size:15px;font-weight:700;line-height:1.28;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .stats{display:flex;gap:10px;margin-top:10px;}
  .stat{
    flex:1;
    background:linear-gradient(180deg, #fff8ec 0%, var(--amber-soft) 100%);
    border-radius:14px;
    padding:11px 8px;text-align:center;
    min-width:0;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -2px 0 rgba(122,68,0,.06) inset,
      0 3px 7px rgba(122,68,0,.08);
  }
  .stat .val{
    font-size:19px;font-weight:800;color:var(--stat-val);font-variant-numeric:tabular-nums;
    white-space:nowrap;line-height:1.15;overflow:hidden;text-overflow:ellipsis;
  }
  .stat .lbl{font-size:11px;color:var(--stat-lbl);margin-top:3px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .stat .lbl .u{font-weight:800;opacity:.8;white-space:nowrap;}
  .stat.empty .val{font-size:13px;color:var(--sub);font-weight:600;}
  .card.issue .stat{background:linear-gradient(180deg, #fff0ee 0%, var(--issue-soft) 100%);}
  .card.issue .stat .val{color:#a8281c;}
  .card.issue .stat .lbl{color:#c14d40;}
  .card.warning .stat{background:linear-gradient(180deg, #fff8e6 0%, var(--gold-soft) 100%);}
  .card.warning .stat .val{color:#8a6100;}
  .card.warning .stat .lbl{color:#a37a1e;}

  .stats.stats-3 .stat .val{font-size:18px;}
  .stats.stats-3 .stat{padding:9px 5px;}

  .status-pill{
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
    display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;}
  .status-pill.ok{background:var(--ok-soft);color:var(--ok-ink);}
  .status-pill.ok .dot{background:var(--ok);}
  .status-pill.issue{background:var(--issue-soft);color:var(--issue-ink);}
  .status-pill.issue .dot{background:var(--issue);}
  .status-pill.warning{background:var(--gold-soft);color:var(--warn-ink);}
  .status-pill.warning .dot{background:var(--gold);}
  .status-pill.stale{background:var(--stale-soft);color:var(--stale-ink);}
  .status-pill.stale .dot{background:var(--stale);}
  .updated{font-size:11px;color:var(--sub);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}

  /* ---------- Summary bar: status filters + live totals ---------- */
  #summaryBar{
    flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin:0 34px 4px;
  }
  .filter-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(30,20,0,.05);
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  .chip.ok .dot{background:var(--ok);}
  .chip.attention .dot{background:var(--issue);}
  .chip.offline .dot{background:var(--stale);}
  .chip.attention.has-items{background:var(--issue-soft);border-color:#ffcec5;color:var(--issue-ink);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--cream);}
  .chip.active .dot{box-shadow:0 0 0 2px var(--cream);}
  .filter-label{font-size:12px;font-weight:700;color:var(--sub);align-self:center;margin-right:2px;}
  .chip.vendor .dot{border-radius:3px;}
  .chip.vendor.Huawei .dot{background:var(--v-huawei);}
  .chip.vendor.Deye .dot{background:var(--v-deye);}
  .chip.vendor.Sigen .dot{background:var(--v-sigen);}

  /* ---------- Footer: pager ---------- */
  footer{
    flex-shrink:0;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:8px 34px 18px;
  }
  .pager{display:flex;align-items:center;gap:12px;}
  .pager-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .pager-btn:hover{border-color:var(--orange);color:var(--orange-deep);}
  #pageLabel{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:74px;text-align:center;}
  .dots{display:flex;gap:7px;}
  .dots span{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.25s;cursor:pointer;}
  .dots span.active{background:var(--orange);width:22px;border-radius:5px;}
  .rotate-progress{flex:1;max-width:220px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;}
  .rotate-progress span{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left;transform:scaleX(0);}
  .rotate-progress span.run{animation:rotateFill linear forwards;}
  @keyframes rotateFill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .footer-hint{font-size:11px;color:var(--sub);}
  .footer-hint kbd{
    font-family:inherit;font-size:10.5px;font-weight:700;
    padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel);
  }
  footer.single-page .pager, footer.single-page .rotate-progress{display:none;}

  #loading, #errorBox{
    flex:1;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--sub);font-size:15px;text-align:center;padding:0 40px;
  }
  #errorBox{display:none;color:#a8281c;}
  #errorBox code{background:var(--gold-soft);padding:2px 6px;border-radius:6px;font-size:13px;}

  /* ---------- Detail modal ---------- */
  #modalOverlay{
    display:none;position:fixed;inset:0;background:rgba(30,22,10,.45);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:50;align-items:center;justify-content:center;padding:30px;
  }
  #modalOverlay.show{display:flex;}
  #modalBox{
    background:var(--modal-bg, rgba(255,255,255,.92));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-radius:24px;max-width:680px;width:100%;
    max-height:86vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:28px 30px;position:relative;
    box-shadow:0 24px 60px rgba(40,25,0,.25);
    border:1px solid rgba(255,255,255,.6);
  }
  #modalClose{
    position:absolute;top:18px;right:18px;background:var(--stale-soft);border:none;
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--sub);
    transition:background .12s ease;
  }
  #modalClose:hover{background:var(--line);}
  .modal-header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:4px;padding-right:40px;}
  .modal-header h2{font-size:20px;margin:0;font-weight:800;}
  .vendor-chip{
    font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;flex-shrink:0;
  }
  .vendor-chip.Huawei{background:var(--v-huawei);}
  .vendor-chip.Deye{background:var(--v-deye);}
  .vendor-chip.Sigen{background:var(--v-sigen);}
  .modal-sub{font-size:12px;color:var(--sub);margin-bottom:18px;font-weight:500;}
  .modal-hero{
    position:relative;
    margin:-28px -30px 18px;
    height:150px;
    border-radius:24px 24px 0 0;
    background-size:cover;background-position:center;
    display:flex;align-items:flex-end;
    padding:18px 30px 14px;
    overflow:hidden;
  }
  .modal-hero::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(30,15,0,.1) 0%, rgba(20,10,0,.8) 100%);
  }
  .modal-hero .modal-header, .modal-hero .modal-sub{position:relative;z-index:1;margin:0;}
  .modal-hero .modal-header h2{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .modal-hero .modal-sub{color:rgba(255,255,255,.85);margin-top:4px;}
  .modal-hero-inner{display:flex;flex-direction:column;gap:2px;}

  .icon-stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .icon-stat{
    flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;
    box-shadow:0 4px 12px rgba(30,20,0,.05);
  }
  .icon-stat .icon-bubble{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
  }
  .icon-stat .icon-info{min-width:0;}
  .icon-stat .icon-info .v{font-size:16px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-stat .icon-info .l{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:1px;}

  .gauge-section{display:flex;justify-content:center;margin:6px 0 20px;}
  .gauge-wrap{text-align:center;}
  .gauge-wrap .gauge-caption{font-size:11px;color:var(--sub);font-weight:600;margin-top:4px;}
  .modal-section-title{font-size:12px;font-weight:700;color:var(--sub);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.5px;}
  .detail-rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
  .detail-row{
    display:flex;justify-content:space-between;padding:11px 14px;background:var(--panel);font-size:13px;
  }
  .detail-row .k{color:var(--sub);font-weight:500;}
  .detail-row .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .device-card{
    background:var(--amber-soft);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;
  }
  .device-card .dname{font-weight:700;color:var(--stat-val);margin-bottom:5px;font-size:13px;}
  .device-card .drow{display:flex;justify-content:space-between;color:var(--stat-lbl);padding:2px 0;}
  .device-card .drow b{color:var(--ink);}
  .alarm-card{
    background:var(--issue-soft);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  }
  .alarm-card .aname{font-weight:700;color:var(--issue-ink);font-size:14px;margin-bottom:4px;}
  .alarm-card .arow{font-size:12px;color:var(--ink);opacity:.85;margin-top:6px;line-height:1.5;}
  .alarm-card .arow b{color:var(--ink);}
  .alarm-card.minor{background:var(--gold-soft);}
  .alarm-card.minor .aname{color:var(--warn-ink);}
  .no-alarm-note{
    background:var(--ok-soft);color:var(--ok-ink);border-radius:14px;padding:14px 16px;font-size:13px;font-weight:500;
  }
  .loader-spinner{
    width:46px;height:46px;border-radius:50%;
    border:4px solid var(--line);
    border-top-color:var(--orange);
    animation:loaderSpin .8s linear infinite;
  }
  @keyframes loaderSpin{to{transform:rotate(360deg);}}
  .loader-text{font-size:14px;color:var(--sub);font-weight:600;}
  .loader-dots span{animation:loaderBlink 1.4s infinite;opacity:0;}
  .loader-dots span:nth-child(2){animation-delay:.2s;}
  .loader-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes loaderBlink{0%,80%,100%{opacity:0;}40%{opacity:1;}}
  .heuristic-note{
    background:var(--stale-soft);color:var(--stale-ink);border-radius:14px;padding:12px 14px;font-size:11.5px;margin-top:10px;line-height:1.5;
  }

  /* ---------- Mobile ---------- */
  @media (max-width:700px){
    body{overflow-y:auto;height:auto;min-height:100vh;}
    header{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;margin:14px 16px 10px;padding:10px 14px;}
    .brand{gap:8px;}
    .brand img.logo{height:22px;}
    .brand h1{font-size:14.5px;line-height:1.25;}
    .brand span{display:none;}
    .header-right{width:auto;justify-content:flex-end;}
    #clock{font-size:12.5px;text-align:right;}
    #clock small{font-size:9px;}
    #pauseBtn{display:none;}
    #ribbon{margin:0 16px 10px;padding:10px 16px;font-size:12px;}
    #healthBar{margin:4px 16px 8px;padding:9px 14px;font-size:12px;}
    #summaryBar{flex-direction:column;align-items:stretch;gap:10px;margin:0 16px 6px;}
    .filter-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;}
    .filter-chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;font-size:12.5px;padding:7px 12px;}
    .footer-hint{display:none;}
    #searchBar{right:0;width:calc(100vw - 32px);max-width:320px;}
    #loading,#errorBox{padding:40px 24px;font-size:14px;text-align:center;}
    main{
      grid-template-columns:repeat(2,1fr);
      grid-template-rows:none !important;
      grid-auto-rows:auto;
      padding:6px 18px 12px;
      overflow:visible;
      gap:12px;
    }
    .card-photo{flex:0 0 auto;height:120px;}
    .card-body{padding:12px 14px 14px;}
    .card:hover{transform:none;}
    .site-name{font-size:14px;}
    .stats{gap:8px;}
    .stat{padding:9px 6px;}
    .stat .val{font-size:16px;}
    .stat .lbl{font-size:10.5px;}
    .stats.stats-3 .stat .val{font-size:14px;}
    .status-pill{font-size:11px;padding:4px 8px;}
    .updated{font-size:10.5px;}
    footer{display:none !important;}
    #modalOverlay{padding:14px;}
    #modalBox{padding:22px 18px;max-height:92vh;border-radius:20px;}
    .modal-header h2{font-size:17px;}
    .modal-stats .stat{flex:1 1 100px;}
  }
  @media (max-width:420px){
    main{grid-template-columns:1fr;}
  }
  /* Desktop / TV: one row of big cards per page (5 on wide screens).
     Text scales with the screen so it stays readable from across the room. */
  @media (min-width:701px){
    .card-body{padding:clamp(12px,1vw,22px) clamp(14px,1.1vw,24px) clamp(14px,1.1vw,24px);margin-top:-22px;border-radius:22px 22px 0 0;}
    .card-meta{margin-bottom:clamp(6px,.6vw,12px);}
    .site-name{font-size:clamp(16px,1.35vw,28px);}
    .stats{gap:clamp(8px,.6vw,14px);margin-top:clamp(10px,.8vw,18px);}
    .stat{padding:clamp(10px,.8vw,18px) 6px;border-radius:clamp(12px,1vw,18px);}
    .stat .val, .stats.stats-3 .stat .val{font-size:clamp(18px,1.6vw,34px);}
    .stat .lbl{font-size:clamp(11px,.8vw,16px);}
    .status-pill{font-size:clamp(11px,.8vw,16px);padding:4px 12px;}
    .status-pill .dot{width:clamp(7px,.5vw,10px);height:clamp(7px,.5vw,10px);}
    .updated{font-size:clamp(11px,.75vw,15px);}
    .vendor-chip-badge{font-size:clamp(10px,.7vw,14px);padding:4px 11px;}
    .card-alert-banner{font-size:clamp(11px,.8vw,16px);padding:clamp(7px,.6vw,12px) 14px;}
  }
  @media (min-width:701px) and (max-width:1200px){ main{grid-template-columns:repeat(4,1fr);} }
  @media (min-width:701px) and (max-width:950px){ main{grid-template-columns:repeat(3,1fr);} }

  /* ---------- Keyboard focus + motion preferences ---------- */
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .card:focus-visible{outline-offset:3px;}
  #ribbon:hover #ribbonTrack{animation-play-state:paused;}
  @media (prefers-reduced-motion: reduce){
    #leafLayer, #sunGlow .beam{display:none;}
    #sunGlow .sun-core, .card.issue, #ribbon .siren, .card-alert-banner .banner-dot{animation:none;}
    #ribbonTrack{animation-duration:60s;}
    .card, .chip, #pauseBtn, #searchToggleBtn, #darkModeToggle{transition:none;}
  }

  /* ============================================================
     DARK MODE — calm, low-glare theme for wall displays at night.
     Status colours are unchanged from light mode so they keep their meaning.
     ============================================================ */
  body.dark-mode{
    --cream:#15110d;
    --panel:#211b15;
    --ink:#f6ede3;
    --sub:#a8988a;
    --line:#3a3027;
    --amber-soft:#2b2219;
    --gold-soft:#3a2c14;
    --ok-soft:#14301f;
    --issue-soft:#3d1a15;
    --stale-soft:#2b2622;
    --header-ink:#f6ede3;
    --header-sub:#a8988a;
    --stat-val:#ffc27a;
    --stat-lbl:#b8936a;
    --ok-ink:#6fdc97;
    --issue-ink:#ff8f80;
    --warn-ink:#ffd27a;
    --stale-ink:#b3aca5;
    --glass:rgba(33,27,21,.78);
    --modal-bg:rgba(28,23,18,.96);
    --focus:#ffa94d;
  }
  body.dark-mode header{border-color:rgba(255,255,255,.06);box-shadow:0 16px 36px rgba(0,0,0,.45);}
  body.dark-mode .brand img.logo{filter:drop-shadow(0 0 1px rgba(255,255,255,.35));}
  body.dark-mode .card{
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px rgba(0,0,0,.45);
  }
  body.dark-mode .card:hover{box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 36px rgba(0,0,0,.6);}
  body.dark-mode .card.issue{border-color:#7a2a20;}
  body.dark-mode .card.warning{border-color:#6b5320;}
  body.dark-mode .stat,
  body.dark-mode .card.issue .stat,
  body.dark-mode .card.warning .stat{background:var(--amber-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
  body.dark-mode .card.issue .stat .val{color:var(--issue-ink);}
  body.dark-mode .card.issue .stat .lbl{color:#d9776b;}
  body.dark-mode .card.warning .stat .val{color:var(--warn-ink);}
  body.dark-mode .card.warning .stat .lbl{color:#c9a35a;}
  body.dark-mode .chip.attention.has-items{border-color:#7a2a20;}
  body.dark-mode #healthBar{border-color:#7a2a20;}
  body.dark-mode .icon-stat{background:var(--panel);border-color:var(--line);}
  body.dark-mode #searchBar{box-shadow:0 20px 44px rgba(0,0,0,.6);}
</style>
</head>

function gvizUrl(sheetName){
  return `${PROXY_URL}?sheet=${encodeURIComponent(sheetName)}`;

/* ============================================================
   CSV PARSER
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else{ field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else{ field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.length>1 || r[0]!=="").map(r=>{
    const o = {};
    headers.forEach((h,idx)=> o[h] = (r[idx]!==undefined ? r[idx].trim() : ""));
    return o;
  });
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  if(!res.ok) throw new Error(`โหลด ${sheetName} ไม่สำเร็จ (${res.status})`);
  const text = await res.text();
  return parseCSV(text);
}

async function fetchDeyeDailyFromSupabase(){
  const today = new Date().toLocaleDateString("sv-SE", {timeZone:"Asia/Bangkok"});
  const url = `${SUPABASE_URL}/rest/v1/daily_readings?select=station_id,production,consumption,fed_to_grid,purchase,revenue&station_id=like.DEYE:*&reading_date=eq.${today}`;
  const res = await fetch(url, {
    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error(`โหลด Deye daily จาก Supabase ไม่สำเร็จ (${res.status})`);
  const rows = await res.json();
  return rows.map(r => ({
    stationId: String(r.station_id || "").replace(/^DEYE:/, ""),
    day_generation_kWh: r.production,
    day_self_use_kWh: (r.consumption != null && r.purchase != null) ? (r.consumption - r.purchase) : null,
    day_purchase_kWh: r.purchase,
    day_grid_kWh: r.fed_to_grid,
    saved_cost: r.revenue
  }));
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function num(v){
  if(v === undefined || v === null || v === "") return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function latestByKey(rows, keyField){
  const map = new Map();
  for(const r of rows){
    if(!r[keyField]) continue;
    map.set(r[keyField], r);
  }
  return [...map.values()];
}

function parseTimestamp(s){
  if(!s) return null;
  const d = new Date(s.replace(" ", "T"));
  return isNaN(d.getTime()) ? null : d;
}

/* ============================================================
   โหลดและรวมข้อมูลทุกแหล่ง
   ============================================================ */
async function loadAllSites(){
  const [
    huaweiLatest, huaweiStations, huaweiAlarmsRaw,
    deyeAll, deyeStations, deyeDeviceStatus, deyeAlertsRaw, deyeDailyEnergy,
    sigenInvAll, sigenRealtimeAll, sigenStations, sigenDeviceList,
    sitePhotos
  ] = await Promise.all([
    fetchSheet("Latest_Data"),
    fetchSheet("Station_List").catch(()=>[]),
    fetchSheet("Huawei_Alarms").catch(() => []),
    fetchSheet("Deye_Realtime_Data"),
    fetchSheet("Deye_Station_List").catch(()=>[]),
    fetchSheet("Deye_Device_Status").catch(()=>[]),
    fetchSheet("Deye_Alerts").catch(()=>[]),
    fetchDeyeDailyFromSupabase().catch(()=>null),   // null = request failed (shown in the health bar)
    fetchSheet("Sigen_Inverter_Data"),
    fetchSheet("Sigen_Realtime_Data").catch(()=>[]),
    fetchSheet("Sigen_Station_List").catch(()=>[]),
    fetchSheet("Sigen_Device_List").catch(()=>[]),
    fetchSitePhotos().catch(()=>({}))
  ]);

  // ---- capacity lookup maps ----
  const huaweiCapMap = new Map(huaweiStations.map(r => [r.stationCode, num(r["capacity (kW)"])]));
  const deyeCapMap = new Map(deyeStations.map(r => [r.stationId, num(r.capacity_kW)]));
  const sigenCapMap = new Map(sigenStations.map(r => [r.systemId, {
    pv: num(r.pv_capacity_kW), battery: num(r.battery_capacity_kWh), status: r.status || ""
  }]));

  // ---- Huawei active alarms (latest polling batch, full detail) ----
  let latestHuaweiAlarmMap = new Map();
  if (huaweiAlarmsRaw.length){
    const times = huaweiAlarmsRaw.map(r => parseTimestamp(r.timestamp_polled)).filter(Boolean);
    if (times.length){
      const latestTime = Math.max(...times.map(d => d.getTime()));
      const latestStr = huaweiAlarmsRaw.find(r => {
        const t = parseTimestamp(r.timestamp_polled);
        return t && t.getTime() === latestTime;
      })?.timestamp_polled;

      huaweiAlarmsRaw
        .filter(r => r.timestamp_polled === latestStr)
        .forEach(r => {
          const key = r.stationCode;
          if (!key) return;
          if (!latestHuaweiAlarmMap.has(key)) latestHuaweiAlarmMap.set(key, []);
          latestHuaweiAlarmMap.get(key).push({
            name: r.alarmName || "Alarm",
            device: r.deviceName || "",
            severity: r.alarmSeverity || "",
            occurTime: r.occurTime || "",
            cause: r.raw_json ? tryExtractCause(r.raw_json) : ""
          });
        });
    }
  }
  function tryExtractCause(raw){
    try{
      const m = raw.match(/"alarmCause"\s*:\s*"([^"]*)"/);
      return m ? m[1] : "";
    }catch(e){ return ""; }
  }

  // ---- Deye: latest daily energy / self-use savings snapshot per station ----
  // Supabase is queried for today's reading_date only, so an old day's numbers can never show up here.
  const deyeDailyLatest = latestByKey(deyeDailyEnergy || [], "stationId");
  const deyeDailyMap = new Map(deyeDailyLatest.map(r => [r.stationId, r]));

  // ---- Deye: history of active power per station (to detect *sustained* zero, not momentary) ----
  const deyeHistoryMap = new Map();
  for(const r of deyeAll){
    if(!r.stationId) continue;
    const t = parseTimestamp(r.timestamp);
    if(!t) continue;
    if(!deyeHistoryMap.has(r.stationId)) deyeHistoryMap.set(r.stationId, []);
    deyeHistoryMap.get(r.stationId).push({t:t.getTime(), val:num(r.active_power_kW)});
  }
  for(const arr of deyeHistoryMap.values()) arr.sort((a,b)=>a.t-b.t);

  // ---- Deye: per-device connectStatus (real connectivity signal, same as Deye Cloud's own
  // Online / Partially Offline / Offline classification) grouped by stationId ----
  const deyeDeviceMap = new Map();
  for(const r of deyeDeviceStatus){
    if(!r.stationId) continue;
    if(!deyeDeviceMap.has(r.stationId)) deyeDeviceMap.set(r.stationId, []);
    deyeDeviceMap.get(r.stationId).push({
      type: r.deviceType || "Device",
      sn: r.deviceSn || "",
      connected: String(r.connectStatus) === "1",
      lastSeen: r.collectionTime || ""
    });
  }

  // ---- Deye: real active alerts from /station/alertList (latest polling batch only) ----
  let latestDeyeAlertMap = new Map();
  if (deyeAlertsRaw.length){
    const times = deyeAlertsRaw.map(r => parseTimestamp(r.timestamp_polled)).filter(Boolean);
    if (times.length){
      const latestTime = Math.max(...times.map(d => d.getTime()));
      const latestStr = deyeAlertsRaw.find(r => {
        const t = parseTimestamp(r.timestamp_polled);
        return t && t.getTime() === latestTime;
      })?.timestamp_polled;

      deyeAlertsRaw
        .filter(r => r.timestamp_polled === latestStr && r.stationId)
        .forEach(r => {
          if (!latestDeyeAlertMap.has(r.stationId)) latestDeyeAlertMap.set(r.stationId, []);
          latestDeyeAlertMap.get(r.stationId).push({
            name: r.alertName || "Alert",
            deviceType: r.deviceType || "",
            impact: String(r.impact) === "1",
            level: r.level || "",
            startTime: r.alertStartTime || ""
          });
        });
    }
  }

  // ---- Sigen: per-device raw status (from /system/{id}/devices, same field
  // Sigen Cloud's own "Devices" tab uses) — kept as-is for reference in the detail modal.
  // NOT used to drive alert state: exact raw string values from this field haven't been
  // confirmed yet, so we show it verbatim rather than guessing "online"/"offline" from it. ----
  const sigenDeviceMap = new Map();
  for(const r of sigenDeviceList){
    if(!r.systemId) continue;
    if(!sigenDeviceMap.has(r.systemId)) sigenDeviceMap.set(r.systemId, []);
    sigenDeviceMap.get(r.systemId).push({
      type: r.deviceType || "Device",
      sn: r.serialNumber || "",
      rawStatus: r.status || ""
    });
  }

  // ---- Sigen: history of total PV power per system (sum of devices at each timestamp) ----
  const sigenTsPower = new Map();
  for(const r of sigenInvAll){
    if(!r.systemId || !r.timestamp) continue;
    const t = parseTimestamp(r.timestamp);
    if(!t) continue;
    if(!sigenTsPower.has(r.systemId)) sigenTsPower.set(r.systemId, new Map());
    const m = sigenTsPower.get(r.systemId);
    const tk = t.getTime();
    m.set(tk, (m.get(tk)||0) + (num(r.pv_power_kW) || 0));
  }
  const sigenHistoryMap = new Map();
  for(const [key, m] of sigenTsPower){
    sigenHistoryMap.set(key, [...m.entries()].map(([t,val])=>({t,val})).sort((a,b)=>a.t-b.t));
  }

  const sites = [];

  // ---- Huawei ----
  for(const r of huaweiLatest){
    if(!r.stationCode) continue;
    sites.push({
      vendor:"Huawei",
      id:r.stationCode,
      name:r.stationName || r.stationCode,
      lastUpdated:parseTimestamp(r.timestamp),
      activeAlarms: latestHuaweiAlarmMap.get(r.stationCode) || [],
      capacityKw: huaweiCapMap.get(r.stationCode) ?? null,
      rawStatus: r.status || "",
      metrics:{
        dayPower: num(r.day_power),
        monthPower: num(r.month_power),
        totalPower: num(r.total_power),
        dayUse: num(r.day_use),
        dayGrid: num(r.day_grid),
        dayIncome: num(r.day_income),
        totalIncome: num(r.total_income),
        savedCost: num(r.saved_cost)
      },
      livePowerKw:null
    });
  }

  // ---- Deye ----
  const deyeLatest = latestByKey(deyeAll, "stationId");
  for(const r of deyeLatest){
    sites.push({
      vendor:"Deye",
      id:r.stationId,
      name:r.stationName || r.stationId,
      lastUpdated:parseTimestamp(r.timestamp),
      activeAlarms: [],
      capacityKw: deyeCapMap.get(r.stationId) ?? null,
      livePowerKw: num(r.active_power_kW),
      powerHistory: deyeHistoryMap.get(r.stationId) || [],
      deviceStatusList: deyeDeviceMap.get(r.stationId) || [],
      deviceAlerts: latestDeyeAlertMap.get(r.stationId) || [],
      metrics:{
        activePower: num(r.active_power_kW),
        consumptionPower: num(r.consumption_power_kW),
        wirePower: num(r.wire_power_kW),
        batteryPower: num(r.battery_power_kW),
        batterySoc: num(r.battery_soc_pct),
        dayGeneration: num((deyeDailyMap.get(r.stationId)||{}).day_generation_kWh),
        daySelfUse: num((deyeDailyMap.get(r.stationId)||{}).day_self_use_kWh),
        dayPurchase: num((deyeDailyMap.get(r.stationId)||{}).day_purchase_kWh),
        dayGrid: num((deyeDailyMap.get(r.stationId)||{}).day_grid_kWh),
        savedCost: num((deyeDailyMap.get(r.stationId)||{}).saved_cost)
      }
    });
  }

  // ---- Sigen: aggregate live power across devices per systemId ----
  const sigenRealtimeLatest = latestByKey(sigenRealtimeAll, "systemId");
  const sigenRealtimeMap = new Map(sigenRealtimeLatest.map(r => [r.systemId, r]));

  const bySystem = new Map();
  for(const r of sigenInvAll){
    if(!r.systemId) continue;
    const key = r.systemId;
    if(!bySystem.has(key)){
      bySystem.set(key, {
        vendor:"Sigen", id:key, name:r.systemName || key,
        livePowerKw:0, lastUpdated:null, activeAlarms: [], devices:[],
        capacityKw: (sigenCapMap.get(key)||{}).pv ?? null,
        powerHistory: sigenHistoryMap.get(key) || [],
        metrics:{}
      });
    }
    const s = bySystem.get(key);
    const p = num(r.pv_power_kW);
    if(p !== null) s.livePowerKw += p;
    const t = parseTimestamp(r.timestamp);
    if(t && (!s.lastUpdated || t > s.lastUpdated)) s.lastUpdated = t;
    s.devices.push({
      type:r.deviceType || "Device",
      status:r.status || "",
      activePower:num(r.active_power_kW),
      pvPower:num(r.pv_power_kW),
      reactivePower:num(r.reactive_power_kW),
      powerFactor:num(r.power_factor),
      gridFreq:num(r.grid_frequency_Hz),
      temp:num(r.internal_temperature_C)
    });
  }
  for(const [key, s] of bySystem){
    const rt = sigenRealtimeMap.get(key);
    if(rt){
      const rtToday = isToday(parseTimestamp(rt.timestamp));
      s.metrics = {
        dayEnergy: rtToday ? num(rt.daily_power_generation_kWh) : null,
        monthEnergy: num(rt.monthly_power_generation),
        annualEnergy: num(rt.annual_power_generation),
        lifetimeEnergy: num(rt.lifetime_power_generation),
        lifetimeCo2: num(rt.lifetime_co2_ton),
        lifetimeTree: num(rt.lifetime_tree_equivalent),
        savedCost: rtToday ? num(rt.saved_cost) : null
      };
    }
    const cap = sigenCapMap.get(key) || {};
    s.batteryCapacityKw = cap.battery ?? null;
    s.sigenStatus = cap.status || "";
    s.sigenDeviceStatusList = sigenDeviceMap.get(key) || [];
    sites.push(s);
  }

  // ---- House photos from Supabase (table site_photos, keyed "Vendor:stationId").
  // Sites without a row get the drawn default house (houseArt) instead.
  for(const s of sites){
    s.photoUrl = sitePhotos[`${s.vendor}:${s.id}`] || "";
  }

  // ---- Freshness of each collector's sheet, so a stopped script is visible on the wall ----
  const fmt = d => d.toLocaleString("th-TH", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  dataHealth = [
    ["Huawei", huaweiLatest],
    ["Deye", deyeAll],
    ["Sigen", sigenInvAll],
    ["Sigen (พลังงานรายวัน / ประหยัดวันนี้)", sigenRealtimeAll]
  ].map(([label, rows]) => ({label, newest: newestTimestamp(rows)}))
   .filter(x => x.newest && Date.now() - x.newest.getTime() > STALE_SOURCE_MS)
   .map(x => ({label: x.label, detail: `ล่าสุด ${fmt(x.newest)}`}));

  // Deye daily comes from Supabase. Today's rows are created just after midnight,
  // so an empty answer after 01:00 means the collector didn't run.
  const deyeDailyLabel = "Deye (พลังงานรายวัน / ประหยัดวันนี้)";
  if(deyeDailyEnergy === null){
    dataHealth.push({label: deyeDailyLabel, detail: "โหลดจาก Supabase ไม่สำเร็จ"});
  } else if(!deyeDailyEnergy.length && new Date().getHours() >= 1){
    dataHealth.push({label: deyeDailyLabel, detail: "ยังไม่มีข้อมูลของวันนี้ใน Supabase"});
  }

  return sites;
}

let dataHealth = [];

function isToday(d){
  return !!d && d.toDateString() === new Date().toDateString();
}

function newestTimestamp(rows){
  let newest = null;
  for(const r of rows){
    const t = parseTimestamp(r.timestamp);
    if(t && (!newest || t > newest)) newest = t;
  }
  return newest;
}

function renderHealth(){
  const bar = document.getElementById("healthBar");
  if(!dataHealth.length){ bar.classList.remove("show"); return; }
  bar.innerHTML = "⚠️ <span>ข้อมูลหยุดอัปเดต — ระบบดึงข้อมูลอาจหยุดทำงาน: " +
    dataHealth.map(x => `<b>${esc(x.label)}</b> (${esc(x.detail)})`).join(" · ") + "</span>";
  bar.classList.add("show");
}

// Default picture for every site (new customers get one automatically): a small house with
// solar panels. Colours are picked from the site id so neighbouring cards don't look identical.

function cssUrl(u){ return `url("${u.replace(/["\\\n]/g, encodeURIComponent)}")`; }

// Uploaded photos are ~600 KB (1706x960). Supabase Storage resizes on the fly,
// so cards ask for a ~30 KB version and the detail view for a medium one.
function photoVariant(url, w, h, q){
  if(!url || !url.includes("/storage/v1/object/public/")) return url;
  return url.replace("/storage/v1/object/public/", "/storage/v1/render/image/public/") + `?width=${w}&height=${h}&quality=${q}`;
}
const cardPhoto = url => photoVariant(url, 540, 960, 70);
const heroPhoto = url => photoVariant(url, 1000, 563, 75);

// Fetch every card photo up front so rotating to the next page shows them instantly.
let preloadedPhotos = [];
function preloadPhotos(sites){
  preloadedPhotos = sites.filter(s => s.photoUrl).map(s => {
    const img = new Image();
    img.src = cardPhoto(s.photoUrl);
    return img;
  });
}

/* ============================================================
   ตัดสิน "ปัญหา"
   ============================================================ */

// states: "ok" | "fault" (confirmed device/vendor fault) | "offline" (real vendor-reported disconnect/no data) | "partial" (some devices disconnected) | "warning" (non-critical alert)
function evaluate(site){
  if(!site.lastUpdated){
    return {state:"offline", reason:"ไม่มีข้อมูล"};
  }

  if(site.vendor === "Huawei"){
    if(site.activeAlarms && site.activeAlarms.length){
      const names = site.activeAlarms.map(a=>a.name).join(", ");
      const isOfflineType = site.activeAlarms.some(a => /connection|communication|network|offline|disconnect/i.test(a.name||""));
      return {state: isOfflineType ? "offline" : "fault", reason:names};
    }
    if(site.rawStatus && site.rawStatus.trim().toLowerCase() !== "normal"){
      return {state:"offline", reason:"Network Connection Error"};
    }
    return {state:"ok", reason:""};
  }

  // Sigen: use the system-level status field from Sigen's own /system endpoint
  // (already fetched into Sigen_Station_List — same categories shown in Sigen Cloud's
  // own UI tabs: Normal / Faulty / External Issue / Offline / Power-off / Standby).
  // This needs no MQTT connection at all, unlike device-level alarms.
  // NOTE: per-device connectivity (sigenDeviceStatusList) is intentionally NOT used to
  // drive status here — we haven't confirmed the exact raw string Sigen's API returns
  // for a device's "status" field, and guessing caused false "disconnected" positives
  // on systems Sigen itself reports as Normal. It's still shown for reference in the
  // detail modal, just not used for alerting until confirmed.
  if(site.vendor === "Sigen" && site.sigenStatus){
    const norm = site.sigenStatus.toLowerCase().replace(/[\s-]/g, "");
    if(norm === "faulty"){
      return {state:"fault", reason:`Sigen รายงานสถานะ: ${site.sigenStatus}`};
    }
    if(norm === "offline"){
      return {state:"offline", reason:`Sigen รายงานสถานะ: ${site.sigenStatus}`};
    }
    if(norm === "externalissue"){
      return {state:"warning", reason:`Sigen รายงานสถานะ: ${site.sigenStatus}`};
    }
    if(norm === "poweroff"){
      return {state:"offline", reason:`ระบบถูกปิด (${site.sigenStatus})`};
    }
    // "Normal" / "Standby" fall through to the normal ok checks below
  }

  const raw = (site.devices ? site.devices.map(d=>d.status).join(" ") : (site.metrics.status||"")).toLowerCase();
  if(raw.includes("fault") || raw.includes("alarm")){
    return {state:"fault", reason:"สถานะผิดปกติ"};
  }

  // Deye: real active alerts from station/alertList (most authoritative signal we have)
  if(site.vendor === "Deye" && site.deviceAlerts && site.deviceAlerts.length){
    const faultAlerts = site.deviceAlerts.filter(a => a.impact);
    if(faultAlerts.length){
      return {state:"fault", reason: faultAlerts.map(a=>a.name).join(", ")};
    }
    return {state:"warning", reason: site.deviceAlerts.map(a=>a.name).join(", ")};
  }

  // Deye: real per-device connectStatus (matches Deye Cloud's own Online/Partially Offline/Offline)
  if(site.vendor === "Deye" && site.deviceStatusList && site.deviceStatusList.length){
    const total = site.deviceStatusList.length;
    const connected = site.deviceStatusList.filter(d => d.connected).length;
    if(connected === 0){
      return {state:"offline", reason:"อุปกรณ์ทั้งหมดขาดการเชื่อมต่อ (Offline)"};
    }
    if(connected < total){
      const names = site.deviceStatusList.filter(d=>!d.connected).map(d=>d.type).join(", ");
      return {state:"partial", reason:`${names} ขาดการเชื่อมต่อ (${connected}/${total} เชื่อมต่ออยู่)`};
    }
  }

  return {state:"ok", reason:""};
}

// The three buckets shown in the summary bar / filter chips.
function statusGroup(state){
  if(state === "ok") return "ok";
  if(state === "offline") return "offline";
  return "attention";
}

function pillInfo(ev){
  if(ev.state === "ok") return {cls:"ok", text:"ปกติ"};
  if(ev.state === "fault") return {cls:"issue", text:"ผิดพลาด"};
  if(ev.state === "issue") return {cls:"issue", text:"ต้องตรวจสอบ"};
  if(ev.state === "warning") return {cls:"warning", text:"แจ้งเตือน"};
  if(ev.state === "partial") return {cls:"warning", text:"เชื่อมต่อไม่ครบ"};
  if(ev.state === "offline") return {cls:"stale", text:"ออฟไลน์"};
  return {cls:"stale", text:"ไม่ทราบสถานะ"};
}

/* ============================================================
   สร้างสถิติสำหรับการ์ดหลัก (เฉพาะที่มีข้อมูลจริง)
   ============================================================ */
function fmtNum(n, digits=2){
  if(n===null || n===undefined) return null;
  return n.toFixed(digits);
}

function fmtSmart(n){
  if(n===null || n===undefined) return null;
  if(n === 0) return "0";
  const a = Math.abs(n);
  if(a < 1) return n.toFixed(3);
  if(a < 10) return n.toFixed(2);
  if(a < 100) return n.toFixed(1);
  return n.toFixed(0);
}

function cardStats(site){
  const list = [];
  if(site.vendor === "Huawei"){
    if(site.metrics.dayPower !== null) list.push({label:"ผลผลิตวันนี้", val:fmtSmart(site.metrics.dayPower), unit:"kWh"});
    if(site.capacityKw !== null) list.push({label:"กำลังติดตั้ง", val:fmtSmart(site.capacityKw), unit:"kW"});
    if(site.metrics.savedCost !== null) list.push({label:"ประหยัดวันนี้", val:fmtSmart(site.metrics.savedCost), unit:"บาท"});
    return list.slice(0,3);
  } else if(site.vendor === "Deye"){
    if(site.livePowerKw !== null) list.push({label:"กำลังไฟ", val:fmtSmart(site.livePowerKw), unit:"kW"});
    if(site.capacityKw !== null) list.push({label:"กำลังติดตั้ง", val:fmtSmart(site.capacityKw), unit:"kW"});
    if(site.metrics.savedCost !== null && site.metrics.savedCost !== undefined) list.push({label:"ประหยัดวันนี้", val:fmtSmart(site.metrics.savedCost), unit:"บาท"});
    return list.slice(0,3);
  } else if(site.vendor === "Sigen"){
    if(site.livePowerKw !== null) list.push({label:"กำลังไฟ", val:fmtSmart(site.livePowerKw), unit:"kW"});
    if(site.capacityKw !== null) list.push({label:"กำลังติดตั้ง (PV)", val:fmtSmart(site.capacityKw), unit:"kW"});
    if(site.metrics.savedCost !== null && site.metrics.savedCost !== undefined) list.push({label:"ประหยัดวันนี้", val:fmtSmart(site.metrics.savedCost), unit:"บาท"});
    return list.slice(0,3);
  }
  return list.slice(0,2);
}

function relTime(d){
  if(!d) return "-";
  const min = Math.round((new Date() - d)/60000);
  if(min < 1) return "เมื่อสักครู่";
  if(min < 60) return `${min} นาทีที่แล้ว`;
  return `${Math.round(min/60)} ชม.ที่แล้ว`;
}

/* ============================================================
   RENDER — GRID
   ============================================================ */
let PAGES = [];
let currentPage = 0;
let rotateTimer = null;
let paused = false;
let allSites = [];
let statusFilter = "all";
let vendorFilter = "all";

function buildCard(site){
  const ev = evaluate(site);
  const stats = cardStats(site);
  const pill = pillInfo(ev);

  const statsHtml = stats.length
    ? `<div class="stats${stats.length>=3?' stats-3':''}">${stats.map(s=>`<div class="stat"><div class="val">${s.val}</div><div class="lbl" title="${s.label} (${s.unit})">${s.label} <span class="u">${s.unit}</span></div></div>`).join("")}</div>`
    : `<div class="stats"><div class="stat empty"><div class="val">ยังไม่มีข้อมูล</div></div></div>`;

  const bannerCls = (ev.state === "fault" || ev.state === "issue") ? "banner-issue"
    : (ev.state === "warning" || ev.state === "partial") ? "banner-warning"
    : (ev.state === "offline") ? "banner-offline" : "";
  const bannerHtml = (bannerCls && ev.reason)
    ? `<div class="card-alert-banner ${bannerCls}" title="${esc(ev.reason)}"><span class="banner-dot"></span><span class="banner-text">${esc(ev.reason)}</span></div>`
    : "";

  const card = document.createElement("div");
  card.className = "card" + (ev.state === "fault" || ev.state === "issue" ? " issue" : "") + (ev.state === "partial" || ev.state === "warning" ? " warning" : "");
  card.innerHTML = `
    <div class="card-photo">
      ${bannerHtml}
    </div>
    <div class="card-body">
      <div class="card-meta">
        <div class="card-meta-left">
          <div class="status-pill ${pill.cls}"><span class="dot"></span>${pill.text}</div>
          <div class="updated">${relTime(site.lastUpdated)}</div>
        </div>
        <div class="vendor-chip-badge ${site.vendor}">${site.vendor}</div>
      </div>
      <div class="site-name" title="${esc(site.name)}">${esc(site.name)}</div>
      ${statsHtml}
    </div>
  `;
  const photo = card.querySelector(".card-photo");
  photo.style.backgroundImage = (site.photoUrl ? cssUrl(cardPhoto(site.photoUrl)) + ", " : "") + houseArt(site.id);
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `${site.name} — ${pill.text}${ev.reason ? " — " + ev.reason : ""}`);
  card.addEventListener("click", () => openDetail(site));
  card.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openDetail(site); }
  });
  return card;
}

function renderPage(idx){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const page = PAGES[idx] || [];
  page.forEach(site => grid.appendChild(buildCard(site)));
  document.querySelectorAll("#dots span").forEach((d,i)=>d.classList.toggle("active", i===idx));
  document.getElementById("pageLabel").textContent = `หน้า ${idx+1} / ${PAGES.length}`;
  document.getElementById("footerBox").classList.toggle("single-page", PAGES.length <= 1);
}

function goToPage(i){
  if(PAGES.length <= 1) return;
  currentPage = (i + PAGES.length) % PAGES.length;
  renderPage(currentPage);
  resetRotateTimer();
}

function buildDots(){
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  PAGES.forEach((_,i)=>{
    const d = document.createElement("span");
    d.onclick = ()=> goToPage(i);
    d.title = `หน้า ${i+1}`;
    dots.appendChild(d);
  });
}

function renderRibbon(){
  const ribbon = document.getElementById("ribbon");
  const track = document.getElementById("ribbonTrack");
    const issues = allSites.map(s=>({site:s, ev:evaluate(s)})).filter(x=>x.ev.state==="fault" || x.ev.state==="issue" || x.ev.state==="partial" || x.ev.state==="warning");
  if(!issues.length){ ribbon.classList.remove("show"); return; }
  ribbon.classList.add("show");
  track.innerHTML = "";
  const doubled = [...issues, ...issues];
  doubled.forEach(x=>{
    const span = document.createElement("span");
    const tag = x.ev.state === "fault" ? "ผิดพลาด" : x.ev.state === "partial" ? "เชื่อมต่อไม่ครบ" : x.ev.state === "warning" ? "แจ้งเตือน" : x.ev.state === "offline" ? "ออฟไลน์" : "ต้องตรวจสอบ";
    span.textContent = `${x.site.name} [${tag}] — ${x.ev.reason}`;
    span.addEventListener("click", ()=> openDetail(x.site));
    track.appendChild(span);
  });
}

function renderSummary(){
  // Status counts follow the selected vendor, so "ต้องตรวจสอบ 2" always matches what you can click into.
  const inVendor = allSites.filter(s => vendorFilter === "all" || s.vendor === vendorFilter);
  const groups = {ok:0, attention:0, offline:0};
  inVendor.forEach(s => groups[statusGroup(evaluate(s).state)]++);
  document.getElementById("cntAll").textContent = inVendor.length;
  document.getElementById("cntOk").textContent = groups.ok;
  document.getElementById("cntAttention").textContent = groups.attention;
  document.getElementById("cntOffline").textContent = groups.offline;
  document.querySelector('.chip[data-filter="attention"]').classList.toggle("has-items", groups.attention > 0);

  ["Huawei","Deye","Sigen"].forEach(v => {
    const n = allSites.filter(s => s.vendor === v).length;
    document.getElementById("cnt" + v).textContent = n;
    document.querySelector(`.chip[data-vendor="${v}"]`).style.display = n ? "" : "none";
  });
}

function isMobileView(){
  return window.matchMedia("(max-width:700px)").matches;
}

let searchQuery = "";

function pageSize(){
  const grid = document.getElementById("grid");
  const cs = getComputedStyle(grid);
  // One row per page: 5 cards on wide screens, 4 or 3 on narrower ones (see the CSS breakpoints).
  const cols = cs.gridTemplateColumns.split(" ").filter(Boolean).length || 5;
  grid.style.gridTemplateRows = "minmax(0, 1fr)";
  return cols;
}

function filteredSites(){
  return allSites.filter(s => {
    if(vendorFilter !== "all" && s.vendor !== vendorFilter) return false;
    if(statusFilter !== "all" && statusGroup(evaluate(s).state) !== statusFilter) return false;
    if(searchQuery && !(s.name.toLowerCase().includes(searchQuery) || s.id.toLowerCase().includes(searchQuery))) return false;
    return true;
  });
}

function paginate(){
  const filtered = filteredSites();
  const empty = !filtered.length;
  const noRes = document.getElementById("searchNoResults");
  noRes.textContent = searchQuery ? "ไม่พบไซต์ที่ตรงกับคำค้นหา"
    : statusFilter === "attention" ? "ไม่มีไซต์ที่ต้องตรวจสอบตอนนี้ 👍"
    : "ไม่มีไซต์ในสถานะนี้";
  noRes.style.display = empty ? "flex" : "none";
  document.getElementById("grid").style.display = empty ? "none" : "grid";

  if(isMobileView()){
    PAGES = [filtered];
  } else {
    const size = pageSize();
    PAGES = [];
    for(let i=0;i<filtered.length;i+=size){
      PAGES.push(filtered.slice(i, i+size));
    }
  }
  if(!PAGES.length) PAGES = [[]];
  currentPage = Math.min(currentPage, PAGES.length-1);
}

function restartProgress(){
  const bar = document.getElementById("rotateBar");
  bar.classList.remove("run");
  if(paused || isMobileView() || searchQuery || PAGES.length <= 1) return;
  void bar.offsetWidth; // restart the CSS animation
  bar.style.animationDuration = ROTATE_MS + "ms";
  bar.classList.add("run");
}

function resetRotateTimer(){
  clearInterval(rotateTimer);
  restartProgress();
  if(paused || isMobileView() || searchQuery || PAGES.length <= 1) return;
  rotateTimer = setInterval(()=>{
    currentPage = (currentPage+1) % PAGES.length;
    renderPage(currentPage);
    restartProgress();
  }, ROTATE_MS);
}

function rerender(resetPage){
  if(!allSites.length) return;
  if(resetPage) currentPage = 0;
  paginate();
  buildDots();
  renderPage(currentPage);
  resetRotateTimer();
}

document.querySelectorAll(".chip[data-filter]").forEach(chip => {
  chip.addEventListener("click", () => {
    statusFilter = chip.dataset.filter;
    document.querySelectorAll(".chip[data-filter]").forEach(c => {
      const on = c === chip;
      c.classList.toggle("active", on);
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
    rerender(true);
  });
});
document.querySelectorAll(".chip[data-vendor]").forEach(chip => {
  chip.addEventListener("click", () => {
    vendorFilter = chip.dataset.vendor;
    document.querySelectorAll(".chip[data-vendor]").forEach(c => {
      const on = c === chip;
      c.classList.toggle("active", on);
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
    renderSummary();
    rerender(true);
  });
});
document.getElementById("prevPage").addEventListener("click", ()=> goToPage(currentPage-1));
document.getElementById("nextPage").addEventListener("click", ()=> goToPage(currentPage+1));

function setPaused(p){
  paused = p;
  document.getElementById("pauseBtn").textContent = paused ? "▶ เล่นต่อ" : "⏸ หยุดเลื่อน";
  resetRotateTimer();
}

document.getElementById("pauseBtn").addEventListener("click", ()=> setPaused(!paused));

const leafLayer = document.getElementById("leafLayer");
const LEAF_EMOJI = ["🍃","🍂","🌿"];
function spawnLeaves(){
  for(let i=0;i<8;i++){
    const piece = document.createElement("div");
    piece.className = "leaf-piece";
    piece.textContent = LEAF_EMOJI[i % LEAF_EMOJI.length];
    piece.style.left = (Math.random()*100) + "vw";
    piece.style.fontSize = (16 + Math.random()*14) + "px";
    const fallDuration = 12 + Math.random()*10;
    const swayDuration = 3 + Math.random()*3;
    piece.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
    piece.style.animationDelay = `${Math.random()*14}s, ${Math.random()*3}s`;
    leafLayer.appendChild(piece);
  }
}
spawnLeaves();

const darkModeToggle = document.getElementById("darkModeToggle");
function applyDarkMode(on){
  document.body.classList.toggle("dark-mode", on);
  darkModeToggle.textContent = on ? "☀️" : "🌙";
  darkModeToggle.title = on ? "โหมดสว่าง" : "โหมดมืด";
  try{ localStorage.setItem("hitech_dark_mode", on ? "1" : "0"); }catch(e){}
}
try{
  applyDarkMode(localStorage.getItem("hitech_dark_mode") === "1");
}catch(e){}
darkModeToggle.addEventListener("click", ()=>{
  applyDarkMode(!document.body.classList.contains("dark-mode"));
});

const searchToggleBtn = document.getElementById("searchToggleBtn");
const searchBar = document.getElementById("searchBar");
function setSearchOpen(open){
  searchBar.classList.toggle("show", open);
  searchToggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if(open) searchInput.focus();
}
searchToggleBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  setSearchOpen(!searchBar.classList.contains("show"));
});
document.addEventListener("click", (e)=>{
  if(!searchBar.contains(e.target) && e.target !== searchToggleBtn && searchBar.classList.contains("show")){
    setSearchOpen(false);
  }
});
searchBar.addEventListener("click", (e)=> e.stopPropagation());

const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
searchInput.addEventListener("input", ()=>{
  searchQuery = searchInput.value.trim().toLowerCase();
  searchClear.style.display = searchQuery ? "block" : "none";
  rerender(true);
});
searchInput.addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){ e.stopPropagation(); setSearchOpen(false); searchToggleBtn.focus(); }
});
searchClear.addEventListener("click", ()=>{
  searchInput.value = "";
  searchQuery = "";
  searchClear.style.display = "none";
  searchInput.focus();
  rerender(true);
});

// Keyboard: ← → change page, / opens search.
document.addEventListener("keydown", (e)=>{
  if(document.getElementById("modalOverlay").classList.contains("show")) return;
  if(e.target.closest && e.target.closest("input, textarea")) return;
  if(e.key === "ArrowRight"){ goToPage(currentPage+1); }
  else if(e.key === "ArrowLeft"){ goToPage(currentPage-1); }
  else if(e.key === "/"){ e.preventDefault(); setSearchOpen(true); }
});

/* ============================================================
   DETAIL MODAL — ข้อมูลเชิงลึกต่อไซต์
   ============================================================ */
function row(k,v,unit){
  if(v===null || v===undefined) return "";
  return `<div class="detail-row"><div class="k">${k}</div><div class="v">${v}${unit?` ${unit}`:""}</div></div>`;
}

function buildDetailBody(site){
  let html = "";

    const m = site.metrics;

    html += `</div>`;

    if(site.deviceAlerts && site.deviceAlerts.length){
      html += `<div class="modal-section-title">Alert ที่กำลัง Active (${site.deviceAlerts.length})</div>`;
      site.deviceAlerts.forEach(a=>{
        html += `
          <div class="alarm-card${a.impact ? '' : ' minor'}">
            <div class="aname">${esc(a.name)}${a.impact ? ' · กระทบการผลิต' : ' · ไม่กระทบการผลิต'}</div>
            ${a.deviceType ? `<div class="arow"><b>อุปกรณ์:</b> ${esc(a.deviceType)}</div>` : ""}
            ${a.startTime ? `<div class="arow"><b>เริ่มเกิด:</b> ${esc(a.startTime)}</div>` : ""}
          </div>`;
      });
    } else {
      html += `<div class="modal-section-title">Alert</div><div class="no-alarm-note">ไม่มี alert active อยู่ตอนนี้</div>`;
    }

    if(site.deviceStatusList && site.deviceStatusList.length){
      html += `<div class="modal-section-title">สถานะการเชื่อมต่ออุปกรณ์ (${site.deviceStatusList.length})</div>`;
      site.deviceStatusList.forEach(d=>{
        html += `<div class="device-card">
          <div class="dname">${d.type}</div>
          <div class="drow"><span>สถานะ</span><b style="color:${d.connected ? 'var(--ok-ink)' : 'var(--issue-ink)'}">${d.connected ? 'เชื่อมต่ออยู่' : 'ขาดการเชื่อมต่อ'}</b></div>
          ${d.lastSeen ? `<div class="drow"><span>เห็นข้อมูลล่าสุด</span><b>${d.lastSeen}</b></div>` : ""}
        </div>`;
      });
    }

    const ev = evaluate(site);
    if(ev.state === "issue" || ev.state === "fault" || ev.state === "partial" || ev.state === "warning"){
      html += `<div class="modal-section-title">สถานะที่ตรวจพบ</div><div class="alarm-card"><div class="aname">${esc(ev.reason)}</div></div>`;
    }
    

  } else if(site.vendor === "Sigen"){
    const m = site.metrics;
    html += `<div class="modal-section-title">ผลผลิตพลังงาน</div><div class="detail-rows">`;
    html += row("กำลังไฟตอนนี้", fmtNum(site.livePowerKw,2), "kW");
    html += row("ผลผลิตวันนี้", fmtNum(m.dayEnergy,2), "kWh");
    html += row("ผลผลิตเดือนนี้", fmtNum(m.monthEnergy,1), "kWh");
    html += row("ผลผลิตปีนี้", fmtNum(m.annualEnergy,1), "kWh");
    html += row("ผลผลิตสะสมทั้งหมด", fmtNum(m.lifetimeEnergy,1), "kWh");
    html += row("กำลังการผลิตติดตั้ง (PV)", fmtNum(site.capacityKw,2), "kW");
    html += row("ความจุแบตเตอรี่", fmtNum(site.batteryCapacityKw,2), "kWh");
    html += row("ประหยัดวันนี้ (โดยประมาณ)", fmtNum(m.savedCost,2), "บาท");
    if(site.sigenStatus) html += row("สถานะจาก Sigen Cloud", site.sigenStatus, "");
    html += `</div>`;

    if(m.lifetimeCo2 !== null || m.lifetimeTree !== null){
      html += `<div class="modal-section-title">ผลกระทบต่อสิ่งแวดล้อม (สะสม)</div><div class="detail-rows">`;
      html += row("ลด CO₂", fmtNum(m.lifetimeCo2,2), "ตัน");
      html += row("เทียบเท่าปลูกต้นไม้", fmtNum(m.lifetimeTree,1), "ต้น");
      html += `</div>`;
    }

    if(site.devices && site.devices.length){
      html += `<div class="modal-section-title">อุปกรณ์ในระบบ (${site.devices.length})</div>`;
      site.devices.forEach(d=>{
        const statusEntry = (site.sigenDeviceStatusList||[]).find(x => x.type === d.type);
        html += `<div class="device-card">
          <div class="dname">${d.type}${d.status ? " · " + d.status : ""}</div>
          ${statusEntry && statusEntry.rawStatus ? `<div class="drow"><span>สถานะ (จาก Sigen)</span><b>${statusEntry.rawStatus}</b></div>` : ""}
          ${d.activePower!==null?`<div class="drow"><span>กำลังไฟ</span><b>${fmtNum(d.activePower,2)} kW</b></div>`:""}
          ${d.pvPower!==null?`<div class="drow"><span>กำลังไฟจากแผง</span><b>${fmtNum(d.pvPower,2)} kW</b></div>`:""}
          ${d.temp!==null?`<div class="drow"><span>อุณหภูมิ</span><b>${fmtNum(d.temp,1)} °C</b></div>`:""}
          ${d.gridFreq!==null?`<div class="drow"><span>ความถี่ไฟฟ้า</span><b>${fmtNum(d.gridFreq,2)} Hz</b></div>`:""}
        </div>`;
      });
    }

    const ev = evaluate(site);
    if(ev.state === "issue" || ev.state === "fault"){
      html += `<div class="modal-section-title">สถานะที่ตรวจพบ</div><div class="alarm-card"><div class="aname">${esc(ev.reason)}</div></div>`;
    }
    
  }
  return html;
}

function statIcon(label){
  if(label.includes("ผลผลิต")) return {icon:"☀️", bg:"linear-gradient(135deg,#ffb347,#ff7a1a)"};
  if(label.includes("กำลังไฟ") && !label.includes("ติดตั้ง")) return {icon:"⚡", bg:"linear-gradient(135deg,#f5a23e,#e85d04)"};
  if(label.includes("ติดตั้ง")) return {icon:"🔧", bg:"linear-gradient(135deg,#c8a27a,#8a6b4a)"};
  if(label.includes("ประหยัด")) return {icon:"💰", bg:"linear-gradient(135deg,#4fc27a,#2fb35d)"};
  return {icon:"📊", bg:"linear-gradient(135deg,#f5a23e,#e85d04)"};
}

function buildIconStatRow(stats){
  return `<div class="icon-stat-row">${stats.map(s=>{
    const {icon,bg} = statIcon(s.label);
    return `<div class="icon-stat">
      <div class="icon-bubble" style="background:${bg}">${icon}</div>
      <div class="icon-info">
        <div class="v">${s.val} <span style="font-size:11px;font-weight:600;opacity:.7;">${s.unit}</span></div>
        <div class="l">${s.label}</div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function buildGauge(percent, valueText, label){
  const r=52, c=2*Math.PI*r;
  const pct = Math.min(Math.max(percent,0),100);
  const dash = c*pct/100;
  return `<div class="gauge-section"><div class="gauge-wrap">
    <svg viewBox="0 0 140 140" width="140" height="140">
      <defs><linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f5a23e"/><stop offset="100%" stop-color="#e85d04"/>
      </linearGradient></defs>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="13"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#gaugeGrad)" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 70 70)"/>
      <text x="70" y="65" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--ink)" font-family="inherit">${valueText}</text>
      <text x="70" y="84" text-anchor="middle" font-size="10" style="fill:var(--sub)" font-family="inherit">${label}</text>
    </svg>
  </div></div>`;
}

let pausedBeforeModal = false;
let focusBeforeModal = null;
function openDetail(site){
  if(!document.getElementById("modalOverlay").classList.contains("show")){
    pausedBeforeModal = paused;
    focusBeforeModal = document.activeElement;
  }
  setPaused(true);

  const stats = cardStats(site);
  const ev = evaluate(site);
  const pill = pillInfo(ev);

  const iconStatsHtml = buildIconStatRow(stats);

  // utilization gauge: only meaningful where we have both a live power reading and installed capacity
  let gaugeHtml = "";
  if(site.livePowerKw !== null && site.livePowerKw !== undefined && site.capacityKw){
    const pct = (site.livePowerKw / site.capacityKw) * 100;
    gaugeHtml = buildGauge(pct, pct.toFixed(0)+"%", "กำลังผลิต ณ ขณะนี้");
  }

  document.getElementById("modalContent").innerHTML = `
    <div class="modal-hero">
      <div class="modal-hero-inner">
        <div class="modal-header">
          <h2 id="modalTitle">${esc(site.name)}</h2>
          <div class="vendor-chip ${site.vendor}">${site.vendor}</div>
          <div class="status-pill ${pill.cls}"><span class="dot"></span>${pill.text}</div>
        </div>
        <div class="modal-sub">รหัสไซต์: ${esc(site.id)} · อัปเดตล่าสุด ${relTime(site.lastUpdated)}</div>
      </div>
    </div>
    ${iconStatsHtml}
    ${gaugeHtml}
    ${buildDetailBody(site)}
  `;
  document.querySelector("#modalContent .modal-hero").style.backgroundImage =
    // The card-size photo is already cached, so it shows at once while the sharper one loads on top.
    (site.photoUrl ? cssUrl(heroPhoto(site.photoUrl)) + ", " + cssUrl(cardPhoto(site.photoUrl)) + ", " : "") + houseArt(site.id);
  document.getElementById("modalOverlay").classList.add("show");
  document.getElementById("modalBox").scrollTop = 0;
  document.getElementById("modalClose").focus();
}

function closeDetail(){
  const overlay = document.getElementById("modalOverlay");
  if(!overlay.classList.contains("show")) return;
  overlay.classList.remove("show");
  setPaused(pausedBeforeModal);
  if(focusBeforeModal && document.contains(focusBeforeModal)) focusBeforeModal.focus();
}
document.getElementById("modalClose").addEventListener("click", closeDetail);
document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "modalOverlay") closeDetail();
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeDetail();
});

/* ============================================================
   CLOCK
   ============================================================ */
function tickClock(){
  const now = new Date();
  document.getElementById("clock").innerHTML =
    now.toLocaleTimeString("th-TH") +
    `<small>${now.toLocaleDateString("th-TH", {weekday:"long", day:"numeric", month:"long", year:"numeric"})}</small>`;
}
setInterval(tickClock, 1000);
tickClock();

/* ============================================================
   MAIN LOAD LOOP
   ============================================================ */
async function refreshData(){
  try{
    allSites = await loadAllSites();
    preloadPhotos(allSites);
    allSites.sort((a,b)=>{
      const ea = evaluate(a).state, eb = evaluate(b).state;
      const rank = s => s==="fault" ? 0 : s==="warning" ? 1 : s==="partial" ? 2 : s==="issue" ? 3 : s==="offline" ? 4 : 5;
      if(rank(ea) !== rank(eb)) return rank(ea)-rank(eb);
      return a.name.localeCompare(b.name, "th");
    });
    document.getElementById("loading").style.display = "none";
    document.getElementById("errorBox").style.display = "none";
    document.getElementById("summaryBar").style.display = "";
    document.getElementById("grid").style.display = "grid";
    document.getElementById("footerBox").style.display = "";
    renderSummary();
    renderRibbon();
    renderHealth();
    paginate();
    buildDots();
    renderPage(currentPage);
    resetRotateTimer();
  }catch(err){
    console.error(err);
    document.getElementById("loading").style.display = "none";
    // Keep showing the last good data if we have it; only show the error screen on first load.
    if(allSites.length) return;
    document.getElementById("grid").style.display = "none";
    document.getElementById("summaryBar").style.display = "none";
    document.getElementById("footerBox").style.display = "none";
    document.getElementById("errorBox").style.display = "flex";
  }
}

let lastRefreshAt = 0;
async function refreshDataTracked(){
  await refreshData();
  lastRefreshAt = Date.now();
}

refreshDataTracked();
setInterval(refreshDataTracked, DATA_REFRESH_MS);

// ---------------------------------------------------------
// FIX: browsers (especially Chrome) throttle setInterval on background/
// unfocused tabs, so a TV dashboard left open for hours can silently stop
// refreshing on schedule even though the underlying Google Sheet is fine.
// Two safeguards:
//   1. When the tab becomes visible again, force an immediate refresh if
//      it's been longer than DATA_REFRESH_MS since the last successful one.
//   2. A lightweight watchdog timer (runs every 20s, cheap no-op if not due)
//      double-checks elapsed real time rather than trusting setInterval alone.
// ---------------------------------------------------------
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && Date.now() - lastRefreshAt > DATA_REFRESH_MS){
    refreshDataTracked();
  }
});
setInterval(()=>{
  if(Date.now() - lastRefreshAt > DATA_REFRESH_MS){
    refreshDataTracked();
  }
}, 20000);

let resizeTimer;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=> rerender(false), 250);
});
</script>
